services:
  # ── Application ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: nodejs-pro-api
    restart: unless-stopped
    ports:
      - "8080:3000"
    env_file: .env
    environment:
      DB_HOST: postgres
      S3_ENDPOINT: http://rustfs:9000
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    networks:
      - public
      - private
    init: true

  # ── Database ───────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: nodejs-pro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-nodejs_pro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-nodejs_pro}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - private

  # ── Object Storage (S3-compatible) ────────────────────────────────
  rustfs:
    image: rustfs/rustfs:latest
    container_name: nodejs-pro-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    networks:
      - private

  # ── One-off jobs (profiles: tools) ────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: nodejs-pro-migrate
    env_file: .env
    environment:
      DB_HOST: postgres
    command: ["node", "./node_modules/typeorm/cli.js", "migration:run", "-d", "dist/data-source.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    profiles:
      - tools

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: nodejs-pro-seed
    env_file: .env
    environment:
      DB_HOST: postgres
    command: ["node", "dist/seeds/seed.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - private
    profiles:
      - tools

  # ── Optional tooling (profiles: debug) ────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nodejs-pro-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    profiles:
      - debug

networks:
  public: {}
  private:
    internal: true

volumes:
  pgdata:
  rustfs_data:
  pgadmin_data:
